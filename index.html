<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 21st Birthday Rain!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.1">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>
<body>

    <!-- Landing Screen -->
    <div id="landing" class="screen active">
        <h1 class="landing-title">Ready for a Surprise?</h1>
        <button id="start-btn" class="glow-btn">Tap to Celebrate</button>
    </div>

    <!-- Main App Screen -->
    <div id="main-app" class="screen">
        
        <!-- Music Player Toggle -->
        <div id="music-toggle" class="glass-orb">
            <span id="music-icon">🎵</span>
        </div>

        <!-- Ambient Candles Background -->
        <div class="candles-bg">
            <div class="candle c1"></div>
            <div class="candle c2"></div>
            <div class="candle c3"></div>
        </div>

        <div id="balloons-container"></div>

        <!-- Birthday Message -->
        <div id="message-container">
            <h2 id="greeting1">Happy 21st Birthday</h2>
            <h1 id="bithday-name">Rain</h1>
        </div>

        <!-- Cake & Interaction Area -->
        <div id="cake-area">
            <p id="cake-instruction" class="pulse-text">Swipe to cut the cake!</p>
            <div id="cake-container">
                <div id="cake-left" class="cake-half"></div>
                <div id="cake-right" class="cake-half"></div>
            </div>
        </div>

        <!-- Final Surprise Pop up -->
        <div id="surprise-popup" class="hidden">
            <h2>Wishing you a year filled with joy and success!</h2>
            <button id="share-btn" class="glow-btn">Share the Love</button>
        </div>

    </div>

    <!-- Swipe Canvas -->
    <canvas id="swipe-canvas"></canvas>

    <script src="js/app.js?v=1.1"></script>
</body>
</html>
